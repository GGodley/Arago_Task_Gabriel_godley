[project]
name = "tilesizer"
version = "1.0.0"
description = "Closed-form performance model and hardware optimizer for tiled matmul on a DMA + matrix-unit engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tilesizer = "tilesizer.cli:main"

[tool.setuptools]
packages = ["tilesizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
